<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página 2 - Bot Receptor</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 30px auto; padding: 20px; }
        .tarea { border: 1px solid #ccc; padding: 15px; margin: 8px 0; border-radius: 8px; }
        .persona1 { background: #e3f2fd; border-left: 5px solid #2196F3; }
        .persona2 { background: #fce4ec; border-left: 5px solid #E91E63; }
        .progreso { background: #ddd; border-radius: 10px; height: 8px; margin-top: 8px; }
        .barra { background: #4CAF50; height: 8px; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Agenda Bot - Recibiendo automático</h1>
    <p>las actividades se reparten asi:</p>
    <div id="agenda"></div>

<script>
    let tareas = JSON.parse(localStorage.getItem('agendaBot')) || [];
    mostrarAgenda();

    // 
    window.addEventListener('storage', function(e) {
        if (e.key === 'tareaNueva') {
            const tareaRecibida = JSON.parse(e.newValue);
            asignarTareaRecibida(tareaRecibida.texto, tareaRecibida.dias);
        }
    });

    function asignarTareaRecibida(textoTarea, diasDuracion) {
        const personaAsignada = Math.random() < 0.5 ? "Miranda" : "Diego";
        
        const fechaInicio = new Date();
        const fechaFin = new Date();
        fechaFin.setDate(fechaInicio.getDate() + diasDuracion);
        
        const nuevaTarea = {
            texto: textoTarea,
            persona: personaAsignada,
            dias: diasDuracion,
            fechaInicio: fechaInicio.toISOString(),
            fechaFin: fechaFin.toISOString()
        };

        tareas.push(nuevaTarea);
        localStorage.setItem('agendaBot', JSON.stringify(tareas));
        mostrarAgenda();
    }

    function calcularProgreso(fechaInicio, fechaFin) {
        const inicio = new Date(fechaInicio);
        const fin = new Date(fechaFin);
        const hoy = new Date();
        const totalMs = fin - inicio;
        const transcurridoMs = hoy - inicio;
        if (hoy >= fin) return 100;
        if (hoy < inicio) return 0;
        return Math.floor((transcurridoMs / totalMs) * 100);
    }

    function mostrarAgenda() {
        const agendaDiv = document.getElementById('agenda');
        agendaDiv.innerHTML = "<h2>Agenda Actual</h2>";
        
        tareas.forEach(t => {
            const claseColor = t.persona === "Persona 1" ? "persona1" : "persona2";
            const progreso = calcularProgreso(t.fechaInicio, t.fechaFin);
            const estaVencida = new Date() > new Date(t.fechaFin);
            const fechaInicioTexto = new Date(t.fechaInicio).toLocaleDateString('es-MX');
            const fechaFinTexto = new Date(t.fechaFin).toLocaleDateString('es-MX');
            
            agendaDiv.innerHTML += `
                <div class="tarea ${claseColor} ${estaVencida ? 'vencida' : ''}">
                    <strong>${t.persona}:</strong> ${t.texto} <br>
                    <small>Duración: ${t.dias} día${t.dias > 1 ? 's' : ''} | ${fechaInicioTexto} → ${fechaFinTexto}</small>
                    <div class="progreso"><div class="barra" style="width: ${progreso}%"></div></div>
                    <small>${progreso}% completado ${estaVencida ? '- VENCIDA' : ''}</small>
                </div>
            `;
        });
    }

    function borrarTodo() {
        if (confirm("¿Borrar toda la agenda?")) {
            tareas = [];
            localStorage.removeItem('agendaBot');
            mostrarAgenda();
        }
    }
</script>
<br>
<br> 
<p>En caso de regresar a el apartado de soporte presencial puede hacerlo aqui</p>
<br>
<button onclick="window.open('suportp.html')">soporte presencial</button>
</body>
</html>
